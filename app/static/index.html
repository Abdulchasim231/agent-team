<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Team</title>
<style>
  :root {
    --bg: #0d0f14; --panel: #151821; --line: #232836; --text: #e6e8ee; --muted: #8a91a5;
    --accent: #6ea8fe; --chief: #f5c26b; --ok: #6bd49a; --err: #ff7a7a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 220px 1fr 380px; height: 100vh; }
  aside, .activity { background: var(--panel); border-color: var(--line); overflow-y: auto; }
  aside { border-right: 1px solid var(--line); padding: 16px; }
  .activity { border-left: 1px solid var(--line); padding: 16px; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
    margin: 20px 0 8px; }
  .agent { font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .agent b { display: block; }
  .agent small { color: var(--muted); word-break: break-all; }
  .session { font-size: 13px; padding: 6px 8px; border-radius: 6px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .session:hover, .session.active { background: var(--line); color: var(--text); }
  button { background: var(--accent); color: #0b1220; border: 0; border-radius: 8px;
    padding: 10px 16px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  .new { width: 100%; margin-top: 12px; background: var(--line); color: var(--text); }
  main { display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 24px; }
  .msg { max-width: 760px; margin: 0 auto 18px; white-space: pre-wrap; }
  .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .msg.user .body { background: var(--line); padding: 10px 14px; border-radius: 10px; }
  .msg.assistant .who { color: var(--chief); }
  form { display: flex; gap: 8px; padding: 16px 24px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; height: 56px; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: inherit; }
  .ev { font-size: 13px; padding: 8px 10px; margin-bottom: 8px; border-radius: 8px;
    background: var(--bg); border-left: 3px solid var(--accent); white-space: pre-wrap;
    word-break: break-word; }
  .ev .h { font-weight: 600; margin-bottom: 2px; }
  .ev.delegate { border-color: var(--chief); }
  .ev.result { border-color: var(--ok); }
  .ev.error { border-color: var(--err); }
  .ev.tool, .ev.thought { color: var(--muted); }
  .ev details summary { cursor: pointer; color: var(--muted); }
  @media (max-width: 1000px) { .app { grid-template-columns: 1fr; } aside, .activity { display: none; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Agent Team</h1>
    <div id="health" style="font-size:12px;color:var(--muted)">checking…</div>
    <button class="new" onclick="newSession()">+ New chat</button>
    <h2>Sessions</h2>
    <div id="sessions"></div>
    <h2>Team</h2>
    <div id="agents"></div>
  </aside>
  <main>
    <div id="messages"></div>
    <form id="form">
      <textarea id="input" placeholder="Tell the chief what you need…  (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="send">Send</button>
    </form>
  </main>
  <section class="activity">
    <h2 style="margin-top:0">Team activity</h2>
    <div id="events"></div>
  </section>
</div>
<script>
let sessionId = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function addMessage(role, text) {
  const el = document.createElement("div");
  el.className = `msg ${role}`;
  el.innerHTML = `<div class="who">${role === "user" ? "You" : "Chief"}</div><div class="body">${esc(text)}</div>`;
  $("messages").appendChild(el);
  el.scrollIntoView({ block: "end" });
}

function addEvent(e) {
  const long = (t) => t && t.length > 280
    ? `<details><summary>${esc(t.slice(0, 200))}…</summary>${esc(t)}</details>` : esc(t);
  const views = {
    delegate: [`chief → ${e.agent}`, `<small>${esc(e.model)}</small>\n${long(e.task)}`],
    result: [`${e.agent} ✓ done`, long(e.text)],
    tool: [`${e.agent} · ${e.tool}`, esc(JSON.stringify(e.args).slice(0, 200))],
    thought: [`${e.agent} thinking`, long(e.text)],
    error: [`${e.agent} error`, esc(e.text)],
  };
  const v = views[e.type];
  if (!v) return;
  const el = document.createElement("div");
  el.className = `ev ${e.type}`;
  el.innerHTML = `<div class="h">${esc(v[0])}</div>${v[1]}`;
  $("events").appendChild(el);
  el.scrollIntoView({ block: "end" });
}

async function loadSidebar() {
  const [agents, sessions, health] = await Promise.all(
    ["/api/agents", "/api/sessions", "/api/health"].map((u) => fetch(u).then((r) => r.json())));
  $("agents").innerHTML = agents.map((a) =>
    `<div class="agent"><b>${esc(a.name)}</b>${esc(a.title)}<br><small>${esc(a.resolved_model)}</small></div>`).join("");
  $("sessions").innerHTML = sessions.map((s) =>
    `<div class="session ${s.id === sessionId ? "active" : ""}" onclick="openSession('${s.id}')">${esc(s.title)}</div>`).join("");
  $("health").textContent = `Ollama ${health.ollama ? "●" : "○"} · OpenRouter ${health.openrouter_key ? "●" : "○ (local fallback)"}`;
}

async function openSession(id) {
  sessionId = id;
  $("messages").innerHTML = ""; $("events").innerHTML = "";
  const data = await fetch(`/api/sessions/${id}`).then((r) => r.json());
  for (const m of data.messages) { m.events.forEach(addEvent); addMessage(m.role, m.content); }
  loadSidebar();
}

function newSession() {
  sessionId = null; $("messages").innerHTML = ""; $("events").innerHTML = ""; loadSidebar();
}

async function send(text) {
  addMessage("user", text);
  $("send").disabled = true;
  try {
    const res = await fetch("/api/chat/stream", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });
    if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!line.startsWith("data: ")) continue;
        const e = JSON.parse(line.slice(6));
        if (e.type === "session") sessionId = e.session_id;
        else if (e.type === "reply") addMessage("assistant", e.text);
        else addEvent(e);
      }
    }
  } catch (err) {
    addEvent({ type: "error", agent: "client", text: err.message });
  } finally {
    $("send").disabled = false;
    loadSidebar();
  }
}

$("form").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const text = $("input").value.trim();
  if (text) { $("input").value = ""; send(text); }
});
$("input").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); $("form").requestSubmit(); }
});
loadSidebar();
</script>
</body>
</html>
